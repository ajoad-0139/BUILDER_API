services:
  db:
    image: postgres:16-alpine
    container_name: presto_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-presto}
      POSTGRES_USER: ${DB_USER:-presto}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-presto_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-presto} -d ${DB_NAME:-presto}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: presto_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
  redis_data:
