openapi: 3.0.3
info:
  title: Presto API
  version: 1.0.0
  description: API for authentication, themes, sites, pages, media, preview and publishing.
paths:
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      description: |-
        Authenticate a user and return authentication tokens.

        Args:
            request: HTTP request containing login credentials.

        Returns:
            Response: User details and generated authentication tokens.

        Raises:
            ValidationError: If the login data is invalid.
            APIError: If the credentials are invalid or the account is disabled.
      summary: Log in and obtain tokens
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/v1/auth/logout:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Blacklist the supplied refresh token and complete logout.

        Args:
            request: HTTP request optionally containing a refresh token.

        Returns:
            Response: Logout confirmation.
      summary: Log out (blacklist refresh token)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
          description: ''
  /api/v1/auth/me:
    get:
      operationId: v1_auth_me_retrieve
      description: |-
        Retrieve the authenticated user's basic profile information.

        Args:
            request: Authenticated HTTP request.

        Returns:
            Response: User ID and username.
      summary: Get the current user
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
          description: ''
  /api/v1/auth/refresh:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Validate a refresh token and return renewed authentication tokens.

        Args:
            request: HTTP request containing the refresh token.

        Returns:
            Response: Newly generated token data.

        Raises:
            APIError: If the refresh token is missing, invalid, or expired.
      summary: Refresh the access token
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
          description: ''
  /api/v1/auth/register:
    post:
      operationId: v1_auth_register_create
      description: |-
        Register a new user and return authentication tokens.

        Args:
            request: HTTP request containing registration data.

        Returns:
            Response: Registration details and generated authentication tokens.

        Raises:
            ValidationError: If the registration data is invalid.
      summary: Register a new user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: ''
  /api/v1/sites:
    get:
      operationId: v1_sites_list
      description: |-
        Retrieve the authenticated user's sites.

        Args:
            request: HTTP request containing query parameters.

        Returns:
            Response containing paginated sites.
      summary: List my sites
      parameters:
      - in: query
        name: language
        schema:
          type: string
          minLength: 1
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      - in: query
        name: status
        schema:
          enum:
          - draft
          - published
          - archived
          type: string
          minLength: 1
        description: |-
          * `draft` - Draft
          * `published` - Published
          * `archived` - Archived
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'
          description: ''
    post:
      operationId: v1_sites_create
      description: |-
        Create a new site.

        Args:
            request: HTTP request containing site data.

        Returns:
            Response containing the created site.
      summary: Create a site
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SiteCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteCreateResponse'
          description: ''
  /api/v1/sites/{site_id}:
    get:
      operationId: v1_sites_retrieve
      description: |-
        Retrieve a site by its ID.

        Args:
            request: HTTP request.
            site_id: ID of the site.

        Returns:
            Response containing the site.
      summary: Retrieve a site
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDetailResponse'
          description: ''
    patch:
      operationId: v1_sites_partial_update
      description: |-
        Partially update a site.

        Args:
            request: HTTP request containing fields to update.
            site_id: ID of the site.

        Returns:
            Response containing the updated site.
      summary: Update a site
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Sites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteUpdateInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteUpdateResponse'
          description: ''
    delete:
      operationId: v1_sites_destroy
      description: |-
        Delete a site.

        Args:
            request: HTTP request.
            site_id: ID of the site.

        Returns:
            Response confirming deletion.
      summary: Delete a site
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Sites
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteDeleteResponse'
          description: ''
  /api/v1/sites/{site_id}/images:
    get:
      operationId: v1_sites_images_list
      description: |-
        Retrieve images belonging to a site.

        Args:
            request: HTTP request containing query parameters.
            site_id: ID of the site.

        Returns:
            Response containing serialized images.
      summary: List site images
      parameters:
      - in: query
        name: page
        schema:
          type: string
          format: uuid
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteImageListResponse'
          description: ''
    post:
      operationId: v1_sites_images_create
      description: |-
        Upload images to a site.

        Args:
            request: HTTP request containing image files and metadata.
            site_id: ID of the site.

        Returns:
            Response containing the uploaded images.
      summary: Upload site images
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteImageCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteImageUploadResponse'
          description: ''
  /api/v1/sites/{site_id}/images/{image_id}:
    get:
      operationId: v1_sites_images_retrieve
      description: |-
        Retrieve an image belonging to a site.

        Args:
            request: HTTP request.
            site_id: ID of the site.
            image_id: ID of the image.

        Returns:
            Response containing the image.
      summary: Retrieve a site image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteImageDetailResponse'
          description: ''
    patch:
      operationId: v1_sites_images_partial_update
      description: |-
        Partially update a site image.

        Args:
            request: HTTP request containing image fields to update.
            site_id: ID of the site.
            image_id: ID of the image.

        Returns:
            Response containing the updated image.
      summary: Update a site image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteImageUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteImageUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteImageUpdateInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteImageUpdateResponse'
          description: ''
    delete:
      operationId: v1_sites_images_destroy
      description: |-
        Delete an image from a site.

        Args:
            request: HTTP request.
            site_id: ID of the site.
            image_id: ID of the image.

        Returns:
            Response confirming deletion.
      summary: Delete a site image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteImageDeleteResponse'
          description: ''
  /api/v1/sites/{site_id}/pages:
    get:
      operationId: v1_sites_pages_list
      description: |-
        Retrieve pages belonging to a site.

        Args:
            request: HTTP request containing query parameters.
            site_id: ID of the site.

        Returns:
            Response containing serialized pages.
      summary: List pages of a site
      parameters:
      - in: query
        name: page_type
        schema:
          type: string
          minLength: 1
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageListResponse'
          description: ''
    post:
      operationId: v1_sites_pages_create
      description: |-
        Create a new page for a site.

        Args:
            request: HTTP request containing page data.
            site_id: ID of the site.

        Returns:
            Response containing the created page.
      summary: Create a page
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Pages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PageCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PageCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCreateResponse'
          description: ''
  /api/v1/sites/{site_id}/pages/{page_id}:
    get:
      operationId: v1_sites_pages_retrieve
      description: |-
        Retrieve a specific page.

        Args:
            request: HTTP request.
            site_id: ID of the site.
            page_id: ID of the page.

        Returns:
            Response containing the serialized page.
      summary: Retrieve a page
      parameters:
      - in: path
        name: page_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDetailResponse'
          description: ''
    patch:
      operationId: v1_sites_pages_partial_update
      description: |-
        Partially update an existing page.

        Args:
            request: HTTP request containing fields to update.
            site_id: ID of the site.
            page_id: ID of the page.

        Returns:
            Response containing the updated page.
      summary: Update a page
      parameters:
      - in: path
        name: page_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Pages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPageCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPageCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPageCreateInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageUpdateResponse'
          description: ''
    delete:
      operationId: v1_sites_pages_destroy
      description: |-
        Delete a page from a site.

        Args:
            request: HTTP request.
            site_id: ID of the site.
            page_id: ID of the page.

        Returns:
            Response confirming deletion.
      summary: Delete a page
      parameters:
      - in: path
        name: page_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Pages
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageDeleteResponse'
          description: ''
  /api/v1/sites/{site_id}/preview:
    post:
      operationId: v1_sites_preview_create
      description: |-
        Generate a preview of the specified site.

        Args:
            request: The HTTP request containing the authenticated user.
            site_id: The ID of the site to preview.

        Returns:
            Response: A success response containing the preview result.
      summary: Generate a site preview
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Export
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewSiteResponse'
          description: ''
  /api/v1/sites/{site_id}/publish:
    post:
      operationId: v1_sites_publish_create
      description: |-
        Publish the specified site.

        Args:
            request: The HTTP request containing the authenticated user.
            site_id: The ID of the site to publish.

        Returns:
            Response: A success response containing the publish result.
      summary: Publish a site
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Export
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishSiteResponse'
          description: ''
  /api/v1/sites/{site_id}/videos:
    get:
      operationId: v1_sites_videos_list
      description: |-
        Retrieve videos belonging to a site.

        Args:
            request: HTTP request containing query parameters.
            site_id: ID of the site.

        Returns:
            Response containing serialized videos.
      summary: List site videos
      parameters:
      - in: query
        name: page
        schema:
          type: string
          format: uuid
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVideoListResponse'
          description: ''
    post:
      operationId: v1_sites_videos_create
      description: |-
        Upload videos to a site.

        Args:
            request: HTTP request containing video files and metadata.
            site_id: ID of the site.

        Returns:
            Response containing the uploaded videos.
      summary: Upload site videos
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SiteVideoCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVideoUploadResponse'
          description: ''
  /api/v1/sites/{site_id}/videos/{video_id}:
    get:
      operationId: v1_sites_videos_retrieve
      description: |-
        Retrieve a video belonging to a site.

        Args:
            request: HTTP request.
            site_id: ID of the site.
            video_id: ID of the video.

        Returns:
            Response containing the video.
      summary: Retrieve a site video
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: video_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVideoDetailResponse'
          description: ''
    patch:
      operationId: v1_sites_videos_partial_update
      description: |-
        Partially update a site video.

        Args:
            request: HTTP request containing video fields to update.
            site_id: ID of the site.
            video_id: ID of the video.

        Returns:
            Response containing the updated video.
      summary: Update a site video
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: video_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSiteVideoUpdateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSiteVideoUpdateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSiteVideoUpdateInputRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVideoUpdateResponse'
          description: ''
    delete:
      operationId: v1_sites_videos_destroy
      description: |-
        Delete a video from a site.

        Args:
            request: HTTP request.
            site_id: ID of the site.
            video_id: ID of the video.

        Returns:
            Response confirming deletion.
      summary: Delete a site video
      parameters:
      - in: path
        name: site_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: video_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Site Media
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteVideoDeleteResponse'
          description: ''
  /api/v1/themes:
    get:
      operationId: v1_themes_list
      description: |-
        Retrieve themes with optional filtering and pagination.

        Args:
            request: HTTP request containing query parameters.

        Returns:
            Response containing paginated themes.
      summary: List themes
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - in: query
        name: language
        schema:
          type: string
          minLength: 1
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
      tags:
      - Themes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeListResponse'
          description: ''
    post:
      operationId: v1_themes_create
      description: |-
        Create a new theme.

        Args:
            request: HTTP request containing theme data.

        Returns:
            Response containing the created theme.
      summary: Create a theme
      tags:
      - Themes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThemeCreateInputRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ThemeCreateInputRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ThemeCreateInputRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeCreateResponse'
          description: ''
  /api/v1/themes/{theme_id}:
    get:
      operationId: v1_themes_retrieve
      description: |-
        Retrieve a theme by its ID.

        Args:
            request: HTTP request.
            theme_id: ID of the theme.

        Returns:
            Response containing the theme.
      summary: Retrieve a theme
      parameters:
      - in: path
        name: theme_id
        schema:
          type: string
