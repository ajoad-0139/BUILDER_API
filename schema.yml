components:
  schemas:
    ImageOutput:
      type: object
      description: |-
        Serialize image data for API responses.

        Returns image metadata including file URL, dimensions, file size,
        alternative text, and creation timestamp.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
          description: Unique within this table. Assigned by the database, never reused,
            may have gaps.
        file:
          type: string
          format: uri
          nullable: true
          readOnly: true
        width:
          type: integer
          readOnly: true
          nullable: true
        height:
          type: integer
          readOnly: true
          nullable: true
        size:
          type: integer
          readOnly: true
          nullable: true
        alt_text:
          type: string
          readOnly: true
          description: Short description for screen readers and for when the image
            fails to load.
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - alt_text
      - created_at
      - file
      - height
      - id
      - number
      - size
      - width
    LoginData:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        access:
          type: string
        refresh:
          type: string
      required:
      - access
      - id
      - refresh
      - username
    LoginRequest:
      type: object
      description: Validate user login credentials.
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LoginResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/LoginData'
        message:
          type: string
      required:
      - data
      - message
    LogoutRequestRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
    LogoutResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    MeData:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
      required:
      - id
      - username
    MeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/MeData'
        message:
          type: string
      required:
      - data
      - message
    PageCreateInputRequest:
      type: object
      description: |-
        Validate and deserialize input data for creating a page.

        Validates page metadata and uploaded HTML, CSS, JavaScript,
        and Open Graph image files.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        page_type:
          type: string
          minLength: 1
          description: Kind of page, e.g. home, about, contact.
          maxLength: 255
        canonical_url:
          type: string
          maxLength: 500
        meta_title:
          type: string
          description: Title shown in search results. Up to 70 characters.
          maxLength: 70
        meta_description:
          type: string
          description: Description shown in search results. Up to 160 characters.
          maxLength: 160
        og_title:
          type: string
          description: Title shown when shared on social media. Up to 95 characters.
          maxLength: 95
        og_description:
          type: string
          description: Description shown when shared on social media. Up to 200 characters.
          maxLength: 200
        og_image:
          type: string
          format: binary
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|webp|svg|ico)$
        no_index:
          type: boolean
          default: false
        html_file:
          type: string
          format: binary
          pattern: (?:html|htm)$
        css_file:
          type: string
          format: binary
          pattern: (?:css)$
        js_file:
          type: string
          format: binary
          nullable: true
          pattern: (?:js)$
      required:
      - css_file
      - html_file
      - page_type
      - title
    PageCreateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageOutput'
        message:
          type: string
      required:
      - data
      - message
    PageDeleteResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    PageDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageOutput'
        message:
          type: string
      required:
      - data
      - message
    PageListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PageOutput'
        message:
          type: string
      required:
      - data
      - message
    PageOutput:
      type: object
      description: |-
        Serialize page data for API responses.

        Returns page metadata, SEO fields, uploaded assets, associated
        site information, and creation and update timestamps.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: integer
          readOnly: true
          description: Unique within this table. Assigned by the database, never reused,
            may have gaps.
        title:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          default: ''
          description: URL part of the page, Leave blank to generate it from the title.
          pattern: ^[-a-zA-Z0-9_]+$
        page_type:
          type: string
          readOnly: true
          description: Kind of page, e.g. home, about, contact.
        canonical_url:
          type: string
          readOnly: true
          description: Preferred full URL of this page for search engines, e.g. https://example.com/about.
        meta_title:
          type: string
          readOnly: true
          description: Title shown in search results. Up to 70 characters.
        meta_description:
          type: string
          readOnly: true
          description: Description shown in search results. Up to 160 characters.
        og_title:
          type: string
          readOnly: true
          description: Title shown when shared on social media. Up to 95 characters.
        og_description:
          type: string
          readOnly: true
          description: Description shown when shared on social media. Up to 200 characters.
        og_image:
          type: string
          format: uri
          nullable: true
          readOnly: true
          description: 'Image for social media shares. Recommended size: 1200x630
            px.'
        no_index:
          type: boolean
          readOnly: true
          description: Ask search engines not to list this page.
        html_file:
          type: string
          format: uri
          nullable: true
          readOnly: true
        css_file:
          type: string
          format: uri
          nullable: true
          readOnly: true
        js_file:
          type: string
          format: uri
          nullable: true
          readOnly: true
        site:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - canonical_url
      - created_at
      - css_file
      - html_file
      - id
      - js_file
      - meta_description
      - meta_title
      - no_index
      - number
      - og_description
      - og_image
      - og_title
      - page_type
      - site
      - slug
      - title
      - updated_at
    PageUpdateResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PageOutput'
        message:
          type: string
      required:
      - data
      - message
    PatchedPageCreateInputRequest:
      type: object
      description: |-
        Validate and deserialize input data for creating a page.

        Validates page metadata and uploaded HTML, CSS, JavaScript,
        and Open Graph image files.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        page_type:
          type: string
          minLength: 1
          description: Kind of page, e.g. home, about, contact.
          maxLength: 255
        canonical_url:
          type: string
          maxLength: 500
        meta_title:
          type: string
          description: Title shown in search results. Up to 70 characters.
          maxLength: 70
        meta_description:
          type: string
          description: Description shown in search results. Up to 160 characters.
