        html_file:
          type: string
          format: binary
          pattern: (?:html|htm)$
        css_file:
          type: string
          format: binary
          pattern: (?:css)$
        js_file:
          type: string
          format: binary
          nullable: true
          pattern: (?:js)$
    PatchedSiteImageUpdateInputRequest:
      type: object
      description: |-
        Validate input data for updating a site image.

        Supports replacing the image file and updating its alternative text.
      properties:
        file:
          type: string
          format: binary
          pattern: (?:jpg|jpeg|png|gif|webp|svg|ico)$
        alt_text:
          type: string
          maxLength: 255
    PatchedSiteUpdateInputRequest:
      type: object
      description: |-
        Validate input data for updating an existing site.

        Supports partial updates to site details, language, status,
        published domain, favicon, SEO metadata, and Open Graph image.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        language:
          type: string
          minLength: 1
          description: Language code, e.g. en, bn, fr.
          maxLength: 10
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Draft: work in progress. Published: live. Archived: retired.

            * `draft` - Draft
            * `published` - Published
            * `archived` - Archived
        published_domain:
          type: string
          nullable: true
          description: Custom domain the site is served from, e.g. example.com.
          maxLength: 255
        favicon:
          type: string
          format: binary
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|webp|svg|ico)$
        meta_description:
          type: string
          description: Default search result description. Up to 160 characters.
          maxLength: 160
        og_image:
          type: string
          format: binary
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|webp|svg|ico)$
        no_index:
          type: boolean
          description: Ask search engines not to list this site.
