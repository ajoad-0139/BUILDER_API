      type: object
      description: |-
        Validate input data for updating a site video.

        Supports replacing the video file and updating its title
        or poster image.
      properties:
        file:
          type: string
          format: binary
          pattern: (?:mp4|webm|mov|m4v|ogv)$
        title:
          type: string
          maxLength: 255
        poster:
          type: string
          format: binary
          nullable: true
          pattern: (?:jpg|jpeg|png|gif|webp|svg|ico)$
    PatchedThemeCreateInputRequest:
      type: object
      description: |-
        Validate and deserialize input data for creating a theme.

        Handles theme details, language, activation status, thumbnail,
        HTML content files, CSS, JavaScript, and the authenticated creator.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        slug:
          description: Leave blank to generate it from the name.
          oneOf:
          - type: string
            maxLength: 50
            pattern: ^[-a-zA-Z0-9_]+$
